name: DXR Windows nightly

on:
  push:
    branches: [dxr-terrain-shadows]
  workflow_dispatch:

concurrency:
  group: dxr-windows-nightly
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CINNABAR_RELEASE_CHANNEL: nightly
  CINNABAR_BUILD_COMMIT: ${{ github.sha }}

jobs:
  validation:
    name: Validate Windows DXR
    if: github.event.repository.fork && github.ref == 'refs/heads/dxr-terrain-shadows'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Restore test build cache
        id: rust-cache
        uses: ./.github/actions/dxr-build-cache
        with:
          lane: tests
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        run: cargo fmt --check
      - name: Build and run the DXR regression tests together
        run: |
          pwsh -NoProfile -File packaging/windows/fetch-dxc.ps1 -Out .
          # One feature graph avoids recompiling dependencies for each package separately.
          # The release job compiles the application; these selected targets compile its regressions.
          # Hosted GPU probes may report a named missing fixture, which is not hardware acceptance.
          cargo nextest run --locked -p launcher -p oreui -p client-ui -p render -p cinnabar -p pack-compiler \
            --lib --test dx12_terrain_shadow \
            -E 'test(dxr) | test(pbr::tests) | test(authored_upload) | test(authored_streaming) | test(gui_models::fire::tests) | binary(dx12_terrain_shadow)' \
            --no-fail-fast --success-output immediate

      - name: Save test build cache
        uses: ./.github/actions/dxr-build-cache
        with:
          phase: save
          lane: tests
          key: ${{ steps.rust-cache.outputs.key }}
          matched-key: ${{ steps.rust-cache.outputs.matched-key }}

  package:
    name: Package Windows nightly
    if: github.event.repository.fork && github.ref == 'refs/heads/dxr-terrain-shadows'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Restore release build cache
        id: rust-cache
        uses: ./.github/actions/dxr-build-cache
        with:
          lane: release
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            core/go.sum
            tools/localserver/go.sum
            go.work.sum
            .github/workflows/dxr-nightly.yml
      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          choco install imagemagick --no-progress -y
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make --no-progress -y }
          $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Directory | Select-Object -First 1
          if (-not $magick) { throw "ImageMagick install directory not found" }
          Add-Content $env:GITHUB_PATH $magick.FullName
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          Add-Content $env:GITHUB_PATH "$env:ProgramData\chocolatey\bin"
      - name: Build and package the selected commit
        run: |
          make package-binaries PACKAGE_CARGO_FLAGS=--timings
          pwsh -NoProfile -File packaging/windows/build-installer.ps1
          bash packaging/check-payload.sh windows .local/dist/windows-release/payload
      - name: Save release build cache
        uses: ./.github/actions/dxr-build-cache
        with:
          phase: save
          lane: release
          key: ${{ steps.rust-cache.outputs.key }}
          matched-key: ${{ steps.rust-cache.outputs.matched-key }}
      - name: Prepare test downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item .local/dist/windows-release/*-setup.exe dist/Cinnabar-DXR-nightly-windows-x64-setup.exe
          Compress-Archive -Path .local/dist/windows-release/payload/* -DestinationPath dist/Cinnabar-DXR-nightly-windows-x64.zip
          @("commit=$env:GITHUB_SHA", "branch=dxr-terrain-shadows", "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") | Set-Content dist/build.txt
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content checksums.txt
          Move-Item checksums.txt dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dxr-windows-nightly
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish tested nightly
    needs: [validation, package]
    if: github.event.repository.fork && github.ref == 'refs/heads/dxr-terrain-shadows'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dxr-windows-nightly
          path: dist
      - name: Publish the fork's DXR nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=nightly-dxr
          previous=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          git push origin "$GITHUB_SHA:refs/tags/$tag" --force-with-lease="refs/tags/$tag:$previous"
          cp docs/dxr-nightly.md "$RUNNER_TEMP/dxr-notes.md"
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/dxr-notes.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "DXR Windows nightly" --notes-file "$RUNNER_TEMP/dxr-notes.md" --prerelease --latest=false
          else
            gh release create "$tag" dist/* --verify-tag --title "DXR Windows nightly" --notes-file "$RUNNER_TEMP/dxr-notes.md" --prerelease --latest=false
          fi
