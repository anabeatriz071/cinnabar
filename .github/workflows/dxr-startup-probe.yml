name: DXR Actions startup probe
on:
  workflow_dispatch:
  push:
    branches: [dxr-terrain-shadows]
    paths: ['.github/workflows/dxr-startup-probe.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify hosted job startup
        run: echo 'GitHub hosted job started successfully'
