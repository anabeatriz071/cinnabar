[package]
name = "dxr-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
wgpu = { workspace = true, features = ["dx12"] }
pollster = "0.4"
bytemuck = "1"
